<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <style>
    *{ box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      padding: 16px;
      font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #171927;
      color: #e9ebf5;
    }
    h1 { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
    p.sub { font-size: 12px; color: #8990ab; margin-bottom: 14px; }
    button {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #6842ff;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #7d5cff; }
    button:disabled { opacity: .55; cursor: default; }
    .opts { margin-bottom: 12px; display: flex; flex-direction: column; gap: 7px; }
    .opts label {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: #cfd3e6; cursor: pointer;
    }
    .opts label span { color: #8990ab; }
    .opts input { accent-color: #6842ff; cursor: pointer; }
    #log {
      margin-top: 12px;
      font-size: 12px;
      max-height: 210px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #b9c0dd;
    }
    #sections {
      margin-top: 8px;
      font-size: 11px;
      color: #8990ab;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
    .ok { color: #6ee7a0; }
    .warn { color: #ffb454; }
  </style>
</head>
<body>
  <h1>Raport metrici — Yandex Games</h1>
  <p class="sub">Deschide consola jocului, alege perioada, apoi apasa. Trece singur prin toate sectiunile.</p>
  <div class="opts">
    <label><input type="checkbox" id="optHtml" checked> Raport HTML <span>(grafice, pentru citit)</span></label>
    <label><input type="checkbox" id="optMd" checked> Date pentru AI <span>(.md, complet)</span></label>
    <label><input type="checkbox" id="optCsv"> CSV-urile separat <span>(cate un fisier)</span></label>
  </div>
  <button id="run">Genereaza</button>
  <div id="log"></div>
  <div id="sections"></div>
  <script src="report.js"></script>
  <script src="popup.js"></script>
</body>
</html>
